kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: envsub
  namespace: openshift-gitops
  labels:
    build: envsub
spec:
  lookupPolicy:
    local: false
---
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: envsub
  namespace: openshift-gitops
  labels:
    build: envsub
spec:
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: 'envsub:latest'
  resources: {}
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  strategy:
    type: Docker
    dockerStrategy: {}
  postCommit: {}
  source:
    type: Git
    git:
      uri: 'https://github.com/ambaxter/kustomize-ai'
      ref: main
    contextDir: .envsubst
  runPolicy: Serial
